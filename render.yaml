services:
  - type: web
    name: video-to-report
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: STEP_KEYWORD
        value: "cambiamos al siguiente paso"
    healthCheckPath: /health
    autoDeploy: true
